:root{--primary:#0a1828;--primary-rgb:10,24,40;--accent:#d6a44c;--accent-rgb:214,164,76;--accent2:#8bbaec;--accent2-rgb:139,186,236;--text:#ffffff;--text-rgb:255,255,255;}
:root { color-scheme: dark; --eb-gap: 18px; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 500 15px/1.35 "Fira Sans Condensed", "Arial Narrow", Arial, sans-serif; color: var(--text); background: radial-gradient(120% 90% at 50% 0%, rgba(var(--accent2-rgb), .13), transparent 60%), linear-gradient(180deg, var(--primary), #05090f); }
.no-bg body { background: transparent; }
.eb { padding: 26px clamp(14px, 3vw, 34px) 20px; }
.eb-head { display: flex; align-items: center; gap: 18px; }
.eb-brand { width: 64px; height: 64px; flex: none; object-fit: contain; }
.eb-league { font: 800 13px/1 "Fira Sans Extra Condensed", sans-serif; letter-spacing: .24em; text-transform: uppercase; color: var(--accent2); }
.eb-title { margin: 6px 0 0; font: 800 clamp(28px, 4.4vw, 46px)/1 "Fira Sans Extra Condensed", sans-serif; text-transform: uppercase; letter-spacing: .01em; }
.eb-sub { margin: 7px 0 0; color: rgba(255,255,255,.72); }
.eb-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 0; }
.eb-tabs:empty { display: none; }
.eb-tab { appearance: none; border: 1px solid rgba(var(--accent2-rgb), .45); background: rgba(255,255,255,.03); color: var(--text); padding: 8px 15px; border-radius: 999px; font: 700 14px/1 "Fira Sans Condensed", sans-serif; cursor: pointer; }
.eb-tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #0b0d12; }
.eb-tab:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
.eb-rule { height: 1px; margin: 20px 0 22px; background: linear-gradient(90deg, rgba(var(--accent-rgb), .9), rgba(var(--accent-rgb), 0)); }
.eb-grid { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: var(--eb-gap); align-items: stretch; }
.eb-round { display: flex; flex-direction: column; min-width: 0; }
.eb-round-name { margin: 0 0 12px; font: 800 13px/1.2 "Fira Sans Extra Condensed", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--accent2); }
.eb-list { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 14px; }
.eb-match { background: linear-gradient(135deg, rgba(var(--primary-rgb), .92), rgba(8,13,22,.92)); border: 1px solid rgba(var(--accent2-rgb), .25); border-left: 3px solid rgba(var(--accent2-rgb), .6); border-radius: 6px; padding: 8px 10px 6px; }
.eb-match.is-live { border-left-color: #ff3b4a; box-shadow: 0 0 0 1px rgba(255,59,74,.45); }
.eb-match.is-done { border-left-color: var(--accent); }
.eb-meta { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: rgba(255,255,255,.6); margin-bottom: 4px; }
.eb-code { color: var(--accent2); font-weight: 700; }
.eb-when { margin-left: auto; white-space: nowrap; }
.eb-live { background: #ff3b4a; color: #fff; font-weight: 700; font-size: 10.5px; letter-spacing: .1em; padding: 2px 6px; border-radius: 3px; }
.eb-team { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 9px; padding: 5px 0; }
.eb-team + .eb-team { border-top: 1px solid rgba(255,255,255,.07); }
.eb-logo { width: 26px; height: 26px; display: grid; place-items: center; }
.eb-logo img { width: 100%; height: 100%; object-fit: contain; }
.eb-logo-tbd { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: rgba(var(--accent2-rgb), .85); color: #0b0d12; font: 800 13px/1 "Fira Sans Extra Condensed", sans-serif; }
.eb-name { font: 700 16px/1.15 "Fira Sans Condensed", sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.eb-score { font: 800 19px/1 "Fira Sans Extra Condensed", sans-serif; min-width: 16px; text-align: right; color: rgba(255,255,255,.55); }
.eb-team.is-winner .eb-name { color: var(--accent2); }
.eb-team.is-winner .eb-score { color: var(--accent); }
.eb-team.is-loser { opacity: .62; }
.eb-team.is-tbd .eb-name { color: rgba(255,255,255,.66); font-weight: 500; }
.eb-advance { border-left-color: var(--accent); padding: 8px 10px; }
.eb-advance .eb-team { padding: 2px 0; }
.eb-champion { margin: 22px 0 0; display: flex; align-items: center; gap: 12px; justify-content: center; padding: 12px; border: 1px solid var(--accent); border-radius: 6px; font: 800 20px/1 "Fira Sans Extra Condensed", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.eb-champion .eb-logo { width: 34px; height: 34px; }
.eb-foot { margin-top: 20px; font-size: 12px; color: rgba(255,255,255,.55); letter-spacing: .04em; }
@media (max-width: 760px) {
  .eb-grid { grid-template-columns: minmax(0, 1fr); }
  .eb-list { justify-content: flex-start; }
  .eb-head { gap: 12px; }
  .eb-brand { width: 48px; height: 48px; }
}
.eb-champion[hidden] { display: none; }

</style>
</head>
<body>
<main class="eb">
  <header class="eb-head"><img id="eb-brand" class="eb-brand" alt=""><div><div id="eb-league" class="eb-league"></div><h1 id="eb-title" class="eb-title"></h1><p id="eb-sub" class="eb-sub"></p></div></header>
  <nav id="eb-tabs" class="eb-tabs" role="tablist" aria-label="Brackets"></nav>
  <div class="eb-rule"></div>
  <div id="eb-grid" class="eb-grid"></div>
  <div id="eb-champion" class="eb-champion" hidden></div>

  const query = new URLSearchParams(location.search);
  const REFRESH = 30000;
  const matches = structuredClone(DATA.matches);
  const byCode = new Map(Object.values(matches).map((m) => [m.code, m.id]));
  let current = DATA.brackets.some((b) => b.id === query.get('bracket')) ? query.get('bracket') : DATA.brackets[0]?.id;
  let updated = null;
  let failed = false;

  if (query.get('bg') === '0') document.documentElement.classList.add('no-bg');

  // ---------- data ----------

  /** RFC 4180 CSV: quoted fields, doubled quotes, line breaks inside quotes. */
  function parseCsv(text) {
    const rows = [];
    let row = [];
    let field = '';
    let quoted = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (quoted) {
        if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; } else if (ch === '"') quoted = false; else field += ch;
      } else if (ch === '"') quoted = true;
      else if (ch === ',') { row.push(field); field = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(field); field = '';
        if (row.some((v) => v.trim())) rows.push(row);
        row = [];
      } else field += ch;
    }
    row.push(field);
    if (row.some((v) => v.trim())) rows.push(row);
    return rows;
  }

  const teamKey = (value) => {
    const text = String(value || '').trim();
    if (DATA.teams[text]) return text;
    return Object.keys(DATA.teams).find((tag) => DATA.teams[tag].name === text) || null;
  };
  const score = (value) => (/^\d+$/.test(String(value).trim()) ? Number(value) : null);
  const source = (value) => {
    const found = /^([WL]):(.+)$/.exec(String(value || '').trim());
    return found && byCode.has(found[2]) ? { id: byCode.get(found[2]), outcome: found[1] === 'W' ? 'winner' : 'loser' } : null;
  };

  function applySheet(csv) {
    const rows = parseCsv(csv.replace(/^﻿/, ''));
    const header = (rows.shift() || []).map((h) => h.trim());
    const col = (row, name) => (header.includes(name) ? (row[header.indexOf(name)] ?? '').trim() : undefined);
    if (!header.includes('id') || !header.includes('score_a')) throw new Error('Unexpected sheet columns');
    for (const row of rows) {
      const m = matches[col(row, 'id')];
      if (!m) continue;
      m.date = col(row, 'date') || null;
      m.time = col(row, 'time') || null;
      m.sa = score(col(row, 'score_a'));
      m.sb = score(col(row, 'score_b'));
      const status = col(row, 'status');
      m.status = ['scheduled', 'live', 'done'].includes(status) ? status : 'scheduled';
      m.bestOf = Number(col(row, 'best_of')) || null;
      for (const side of ['a', 'b']) {
        const src = source(col(row, `source_${side}`));
        const key = side === 'a' ? 'srcA' : 'srcB';
        if (src) { m[key] = src; continue; }
        // A fixed bracket path stays; a seeded place follows the team tag of the sheet.
        if (m[key] && !m.openingDraw) continue;
        m[key] = null;
        m[side] = teamKey(col(row, `team_${side}`));
      }
    }
  }

  /** Teams, winner and status of every match, from the sources (same rule as the program). */
  function resolveAll() {
    const out = new Map();
    const visiting = new Set();
    const resolve = (id) => {
      if (out.has(id)) return out.get(id);
      const m = matches[id];
      if (!m || visiting.has(id)) return null;
      visiting.add(id);
      const r = { ...m, labelA: '', labelB: '' };
      for (const [side, key] of [['a', 'srcA'], ['b', 'srcB']]) {
        const src = m[key];
        if (!src) continue;
        const parent = resolve(src.id);
        r[side] = (src.outcome === 'loser' ? parent?.loser : parent?.winner) ?? null;
        r[side === 'a' ? 'labelA' : 'labelB'] = `${src.outcome === 'loser' ? 'Loser' : 'Winner'} ${matches[src.id]?.code || 'TBD'}`;
      }
      const needed = Math.ceil((Number(r.bestOf) || 1) / 2);
      const decisive = r.sa != null && r.sb != null && r.sa !== r.sb && Math.max(r.sa, r.sb) >= needed && r.a && r.b;
      r.winner = decisive && (r.status === 'done' || Number(r.bestOf) > 0) ? (r.sa > r.sb ? r.a : r.b) : null;
      r.loser = r.winner ? (r.winner === r.a ? r.b : r.a) : null;
      if (r.winner) r.status = 'done';
      visiting.delete(id);
      out.set(id, r);
      return r;
    };
    for (const id of Object.keys(matches)) resolve(id);
    return out;
  }

  // ---------- view ----------

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function logo(tag) {
    const team = DATA.teams[tag];
    const box = el('span', 'eb-logo');
    if (team?.logo) {
      const img = el('img');
      img.src = team.logo;
      img.alt = '';
      box.append(img);
    } else box.append(el('span', 'eb-logo-tbd', '?'));
    return box;
  }

  function when(m) {
    const date = m.date ? `${m.date.slice(8, 10)}/${m.date.slice(5, 7)}` : 'Date TBD';
    return [date, m.time || 'Time TBD', m.bestOf ? `BO${m.bestOf}` : ''].filter(Boolean).join(' · ');
  }

  function teamRow(m, side) {
    const tag = m[side];
    const label = side === 'a' ? m.labelA : m.labelB;
    const own = side === 'a' ? m.sa : m.sb;
    const row = el('div', 'eb-team');
    if (m.winner && tag) row.classList.add(m.winner === tag ? 'is-winner' : 'is-loser');
    const name = tag ? DATA.teams[tag]?.name || tag : label || 'TBD';
    if (!tag) row.classList.add('is-tbd');
    row.append(logo(tag), el('span', 'eb-name', name), el('b', 'eb-score', own ?? '–'));
    return row;
  }

  function matchCard(m) {
    const card = el('article', `eb-match is-${m.status}`);
    const meta = el('div', 'eb-meta');
    meta.append(el('b', 'eb-code', m.code), el('span', 'eb-when', when(m)));
    if (m.status === 'live') meta.append(el('span', 'eb-live', 'LIVE'));
    card.append(meta, teamRow(m, 'a'), teamRow(m, 'b'));
    if (m.label) card.append(el('div', 'eb-label', m.label));
    return card;
  }

  function render() {
    const resolved = resolveAll();
    const bracket = DATA.brackets.find((b) => b.id === current) || DATA.brackets[0];
    document.getElementById('eb-title').textContent = bracket.title || bracket.name;
    document.getElementById('eb-sub').textContent = bracket.subtitle || '';
    const tabs = document.getElementById('eb-tabs');
    tabs.replaceChildren(...(DATA.brackets.length > 1 && query.get('tabs') !== '0' ? DATA.brackets.map((b) => {
      const button = el('button', 'eb-tab', b.name);
      button.type = 'button';
      button.setAttribute('role', 'tab');
      button.setAttribute('aria-selected', String(b.id === bracket.id));
      button.addEventListener('click', () => { current = b.id; render(); });
      return button;
    }) : []));
    const columns = bracket.rounds.map((round, index) => {
      const column = el('section', 'eb-round');
      column.append(el('h2', 'eb-round-name', `${String(index + 1).padStart(2, '0')} · ${round.name}`));
      const list = el('div', 'eb-list');
      list.append(...round.matches.map((id) => resolved.get(id)).filter(Boolean).map(matchCard));
      column.append(list);
      return column;
    });
    if (bracket.qualifications?.length) {
      const column = el('section', 'eb-round eb-qualified');
      column.append(el('h2', 'eb-round-name', `${String(columns.length + 1).padStart(2, '0')} · ${bracket.qualifications[0].name}`));
      const list = el('div', 'eb-list');
      for (const q of bracket.qualifications) {
        const parent = resolved.get(q.source.id);
        const tag = q.source.outcome === 'loser' ? parent?.loser : parent?.winner;
        const card = el('article', 'eb-match eb-advance');
        const row = el('div', `eb-team ${tag ? 'is-winner' : 'is-tbd'}`);
        row.append(logo(tag), el('span', 'eb-name', tag ? DATA.teams[tag]?.name || tag : `Winner ${parent?.code || 'TBD'}`));
        card.append(row);
        list.append(card);
      }
      column.append(list);
      columns.push(column);
    }
    const grid = document.getElementById('eb-grid');
    grid.style.setProperty('--cols', columns.length);
    grid.replaceChildren(...columns);
    const champion = bracket.championMatchId ? resolved.get(bracket.championMatchId)?.winner : null;
    const banner = document.getElementById('eb-champion');
    banner.hidden = !champion;
    if (champion) banner.replaceChildren(logo(champion), el('span', '', `Champions · ${DATA.teams[champion]?.name || champion}`));
    const time = updated ? updated.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }) : '';
    document.getElementById('eb-status').textContent = failed
      ? 'Results could not be loaded now. Showing the last known results.'
      : `${bracket.footer || ''}${time ? ` · Updated ${time}` : ''} · Times: ${DATA.timezoneLabel}`;
    sendHeight();
  }

  function sendHeight() {
    if (parent === window) return;
    parent.postMessage({ type: 'bracket-embed-height', id: query.get('frame') || '', height: Math.ceil(document.documentElement.getBoundingClientRect().height) }, '*');
  }

  async function refresh() {
    if (document.hidden) return;
    try {
      const response = await fetch(`${DATA.csvUrl}&t=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      applySheet(await response.text());
      updated = new Date();
      failed = false;
    } catch {
      failed = true;
    }
    render();
  }

  document.getElementById('eb-league').textContent = DATA.league;
  const brand = document.getElementById('eb-brand');
  if (DATA.logo) brand.src = DATA.logo; else brand.remove();
  render();
  refresh();
  setInterval(refresh, REFRESH);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  addEventListener('resize', sendHeight);
  new ResizeObserver(sendHeight).observe(document.documentElement);
})();

</script>
</body>
</html>
