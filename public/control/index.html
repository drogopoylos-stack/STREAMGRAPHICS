<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HLL Broadcast Graphics</title>
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/brand/hll-logo.png">
  <link rel="stylesheet" href="/fonts/commissioner/index.css">
  <link rel="stylesheet" href="/fonts/fira-sans-extra-condensed/600.css">
  <link rel="stylesheet" href="/fonts/fira-sans-extra-condensed/700.css">
  <link rel="stylesheet" href="/fonts/fira-sans-extra-condensed/800.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/sections.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="boot" class="boot" role="status"></div>
  <div id="app" class="app" hidden>
    <header id="topbar" class="topbar"></header>
    <nav id="nav" class="sidenav" aria-label="Sections"></nav>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
  <aside id="drawer" class="drawer" hidden role="complementary"></aside>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <datalist id="country-codes">
    <option value="gr">Greece</option>
    <option value="cy">Cyprus</option>
    <option value="al">Albania</option>
    <option value="be">Belgium</option>
    <option value="bg">Bulgaria</option>
    <option value="de">Germany</option>
    <option value="dk">Denmark</option>
    <option value="es">Spain</option>
    <option value="fr">France</option>
    <option value="gb">United Kingdom</option>
    <option value="it">Italy</option>
    <option value="md">Moldova</option>
    <option value="mk">North Macedonia</option>
    <option value="nl">Netherlands</option>
    <option value="pk">Pakistan</option>
    <option value="pl">Poland</option>
    <option value="pt">Portugal</option>
    <option value="ro">Romania</option>
    <option value="rs">Serbia</option>
    <option value="ru">Russia</option>
    <option value="se">Sweden</option>
    <option value="tn">Tunisia</option>
    <option value="tr">Türkiye</option>
    <option value="ua">Ukraine</option>
    <option value="us">United States</option>
  </datalist>
</body>
</html>
